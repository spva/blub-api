# version: '3.8'

services:
  # Web server
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"  # Port mapping to host
    volumes:
      - ./src:/var/www:cached  # :cached - optimization for Linux
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - nginx-logs:/var/log/nginx  # Dedicated volume for logs
    depends_on:
      - php
    networks:
      - symfony-net

  # PHP handler
  php:
    build:
      context: ./docker/php  # Using our Dockerfile
    volumes:
      - ./src:/var/www:cached
      - phpcomposercache:/composer/cache  # Composer cache between runs
    environment:
      - DB_HOST=mysql
      - DB_USER=symfony
      - DB_PASSWORD=password
      - DB_NAME=symfony_db
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Important for Xdebug!
    networks:
      - symfony-net
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0  # Use official MySQL 8.0 image
    container_name: symfony-mysql  # Container name for convenience
    restart: always  # Always restart container on failures
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Root user password
      MYSQL_DATABASE: symfony_db  # Database name that will be created automatically
      MYSQL_USER: symfony_user  # Username (optional but recommended)
      MYSQL_PASSWORD: userpassword  # User password (optional)
      TZ: Europe/Berlin  # Timezone (configure as needed)
    ports:
      - "3306:3306"  # Port mapping: host:container
    volumes:
      - mysql-data:/var/lib/mysql  # Volume for database storage
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # Initialization SQL script
    networks:
      - symfony-net  # Connect to network (if used)

  # PHPMyAdmin (for visual database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql  # Connection to mysql container
      PMA_USER: symfony
      PMA_PASSWORD: password
    depends_on:
      - mysql
    networks:
      - symfony-net

  # MailHog for email testing (optional)
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"  # Web interface
      - "1025:1025"  # SMTP port
    networks:
      - symfony-net

# Volume management
volumes:
  mysql-data:
    name: ${PROJECT_NAME:-symfony-docker}_mysql-data  # Volume name with project prefix
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./docker/data/mysql  # Host path for MySQL data
  phpcomposercache:
    name: ${PROJECT_NAME:-symfony-docker}_phpcomposercache
    driver: local
    driver_opts:
      type: tmpfs  # For Composer cache, tmpfs can be used for speed
      device: tmpfs
      o: size=100m  # Size limitation
  nginx-logs:
    name: ${PROJECT_NAME:-symfony-docker}_nginx-logs
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./docker/logs/nginx  # Host path for Nginx logs

# Network for container communication
networks:
  symfony-net:
    driver: bridge