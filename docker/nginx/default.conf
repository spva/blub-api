server {
    listen 80;
    server_name localhost;
    
    # Project root (Symfony uses public/)
    root /var/www/public;
    index index.php index.html;

    # Static files handling
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP processing via PHP-FPM
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;  # Connection to php container
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        
        # Important for Symfony!
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        
        internal;
    }

    # Block direct access to .php files
    location ~ \.php$ {
        return 404;
    }

    # Nginx status monitoring (localhost only)
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # PHP-FPM status monitoring
    location /php-status {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
    
    # Real-time logging (useful for debugging)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}